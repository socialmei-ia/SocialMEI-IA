<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SocialMEI.IA — seu negócio em contexto</title>
  <desc id="desc">Banner editorial com a conexão entre cliente, conversa, gestão e próximo passo.</desc>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="1" y="1" width="638" height="638" rx="28" fill="#0c1726" stroke="#2c4059"/>
    <path d="M48 87H592" stroke="#2c4059"/>
    <text x="48" y="57" fill="#eef4fc" font-size="26" font-weight="700">SocialMEI.IA</text>
    <text x="435" y="55" fill="#a1b0c5" font-size="12" font-weight="700" letter-spacing="1.5">CRM PARA MEIs</text>
