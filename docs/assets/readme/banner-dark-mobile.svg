    <text x="48" y="352" fill="#a1b0c5" font-size="20" font-weight="400">Clientes, atendimento e gestão</text>
    <text x="48" y="380" fill="#a1b0c5" font-size="20" font-weight="400">perto de cada próximo passo.</text>
    <path d="M48 417H592" stroke="#2c4059"/>
    <rect x="48" y="449" width="174" height="105" rx="16" fill="#152438" stroke="#2c4059"/>
    <text x="64" y="478" fill="#81b5ff" font-size="13" font-weight="700">01</text>
    <text x="64" y="508" fill="#eef4fc" font-size="20" font-weight="700">Cliente</text>
    <text x="64" y="532" fill="#a1b0c5" font-size="13" font-weight="400">Conhecer</text>
    <rect x="233" y="449" width="174" height="105" rx="16" fill="#152438" stroke="#2c4059"/>
    <text x="249" y="478" fill="#81b5ff" font-size="13" font-weight="700">02</text>
    <text x="249" y="508" fill="#eef4fc" font-size="20" font-weight="700">Conversa</text>
    <text x="249" y="532" fill="#a1b0c5" font-size="13" font-weight="400">Contextualizar</text>
    <rect x="418" y="449" width="174" height="105" rx="16" fill="#152438" stroke="#2c4059"/>
    <text x="434" y="478" fill="#f2c451" font-size="13" font-weight="700">03</text>
    <text x="434" y="508" fill="#eef4fc" font-size="20" font-weight="700">Próximo passo</text>
