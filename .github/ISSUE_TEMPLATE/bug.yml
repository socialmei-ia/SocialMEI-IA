name: "🐞 Bug"
description: "Algo não está funcionando como deveria"
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por registrar o problema. Não inclua senhas, tokens, chaves ou dados sensíveis.
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Dashboard
        - Caixa Unificada
        - n8n
        - PostgreSQL / pgAdmin
        - Docker / Caddy
        - FastAPI
        - GitHub / documentação
        - Outro
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir?
      placeholder: |
        1. Abra...
        2. Clique...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Prints ou mensagens de erro sem segredos.
