name: Export public prototype beta ZIP
on:
  push:
    branches: [feat/native-opportunities-v8-content-v4]
    paths: [.github/workflows/temp-public-demo-export.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated static ZIP with only 3 HTML files
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, subprocess, pathlib
          sources = {
            "index.html": "frontend/testes-publicos.html",
            "reference/Oportunidades-V8-original.html": "frontend/reference/Oportunidades-V8-original.html",
            "reference/Divulgacao-V4-original.html": "frontend/reference/Divulgacao-V4-original.html",
          }
          output = pathlib.Path("SocialMEI-Demonstracao-V8-V4.zip")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=8) as z:
            for target, source in sources.items():
              data = pathlib.Path(source).read_bytes()
              assert data.startswith(b"<!doctype html>") or data.startswith(b"<!DOCTYPE html>")
              assert not any(k in target.lower() for k in (".env", "token", "credentials"))
              z.writestr(target, data)
            z.writestr("INSTRUCOES.txt",
              "SocialMEI.IA — demonstracao estatica isolada das interfaces V8/V4\n"
              "Pagina inicial: index.html\n"
              "Sem backend, API, autenticacao, publicacao Meta, n8n ou WAHA.\n"
              "Dados ficticios apenas no navegador local e sem sincronizacao.\n"
              "Hospedar somente em HTTPS e origem SEPARADA do CRM oficial.\n"
              "Commit fonte: " + subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip() + "\n")
          print(output.name, output.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: socialmei-static-beta-v8-v4
          path: SocialMEI-Demonstracao-V8-V4.zip
          retention-days: 3
