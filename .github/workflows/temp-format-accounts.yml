name: Format account frontend for integrated QA
on:
  push:
    branches:
      - feat/whatsapp-catalog-menu-20261026
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/whatsapp-catalog-menu-20261026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply repository formatter
        run: |
          npx prettier --write frontend/scripts/entrada.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/scripts/entrada.js
          if ! git diff --cached --quiet; then
            git commit -m "Format real account signup texts"
            git push origin HEAD:feat/whatsapp-catalog-menu-20261026
          fi
