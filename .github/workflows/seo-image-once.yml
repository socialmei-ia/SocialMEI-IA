name: Copy approved SocialMEI social image once
on:
  push:
    branches:
      - feat/public-seo-discovery-consent-20261031
permissions:
  contents: write
jobs:
  copy-social-image:
    if: github.repository == 'socialmei-ia/SocialMEI-IA' && github.actor == 'socialmei-ia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reuse brand image already tracked in the repository
        run: |
          set -euo pipefail
          test -s docs/assets/socialmei-banner.png
          mkdir -p frontend/assets
          cp docs/assets/socialmei-banner.png frontend/assets/socialmei-og.png
          cmp docs/assets/socialmei-banner.png frontend/assets/socialmei-og.png
          file frontend/assets/socialmei-og.png | grep -q 'PNG image data'
      - name: Commit copied image without touching any other file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/assets/socialmei-og.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(seo): add the existing SocialMEI social preview PNG'
          git push origin HEAD:refs/heads/feat/public-seo-discovery-consent-20261031
