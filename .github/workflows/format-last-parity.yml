name: Format final V8 V4 parity adjustments
on:
  push:
    branches: [feat/native-opportunities-v8-content-v4]
    paths:
      - .github/workflows/format-last-parity.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reformat changes
        run: |
          npx prettier --write frontend/scripts/divulgacao-v4-parity.js tests/visual-content-browser.cjs docs/PROTOTYPE-PARITY-V8-V4.md frontend/scripts/opportunity-lifecycle.js tests/visual-opportunities-preview.cjs
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/scripts/divulgacao-v4-parity.js tests/visual-content-browser.cjs docs/PROTOTYPE-PARITY-V8-V4.md frontend/scripts/opportunity-lifecycle.js tests/visual-opportunities-preview.cjs
            git commit -m "style(review): final V8 V4 parity format"
            git push origin HEAD:refs/heads/feat/native-opportunities-v8-content-v4
          fi
