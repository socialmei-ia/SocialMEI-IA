name: Temporary formatting for urgent editorial PR
on:
  push:
    branches:
      - feat/urgent-n8n-editorial-20261021
    paths:
      - .github/workflows/urgent-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/urgent-n8n-editorial-20261021
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format four reported paths only
        run: npx prettier --write frontend/scripts/content-studio.js frontend/socialmei-app.html tests/native-opportunities-browser.cjs docs/N8N-INTEGRATION-GAP-2026-10-21.md
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/scripts/content-studio.js frontend/socialmei-app.html tests/native-opportunities-browser.cjs docs/N8N-INTEGRATION-GAP-2026-10-21.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format urgent editorial changes"
            git push origin HEAD:feat/urgent-n8n-editorial-20261021
          fi
