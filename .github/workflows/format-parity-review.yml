name: Format original prototype parity review
on:
  push:
    branches:
      - feat/native-opportunities-v8-content-v4
    paths:
      - frontend/scripts/opportunities-v8.js
      - frontend/scripts/opportunity-lifecycle.js
      - frontend/scripts/opportunities-v8-parity.js
      - frontend/scripts/divulgacao-v4-parity.js
      - frontend/scripts/content-drafts.js
      - frontend/styles/prototype-v8-v4-parity.css
      - frontend/socialmei-app.html
      - tests/content-drafts.test.cjs
      - tests/visual-opportunities-preview.cjs
      - tests/visual-content-browser.cjs
      - tests/repository.test.cjs
      - .github/workflows/format-parity-review.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format changed files with repository Prettier
        run: |
          npx prettier --write frontend/scripts/opportunities-v8.js frontend/scripts/opportunity-lifecycle.js frontend/scripts/opportunities-v8-parity.js frontend/scripts/divulgacao-v4-parity.js frontend/scripts/content-drafts.js frontend/styles/prototype-v8-v4-parity.css frontend/socialmei-app.html tests/content-drafts.test.cjs tests/visual-opportunities-preview.cjs tests/visual-content-browser.cjs tests/repository.test.cjs
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/scripts/opportunities-v8.js frontend/scripts/opportunity-lifecycle.js frontend/scripts/opportunities-v8-parity.js frontend/scripts/divulgacao-v4-parity.js frontend/scripts/content-drafts.js frontend/styles/prototype-v8-v4-parity.css frontend/socialmei-app.html tests/content-drafts.test.cjs tests/visual-opportunities-preview.cjs tests/visual-content-browser.cjs tests/repository.test.cjs
            git commit -m "style(frontend): format prototype parity integrations"
            git push origin HEAD:refs/heads/feat/native-opportunities-v8-content-v4
          fi
