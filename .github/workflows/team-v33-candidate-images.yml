name: Team v33 candidate images (off-VPS)

on:
  pull_request:
    branches:
      - release/functional-businesses-20261103
      - release/local-v0.1-preparation-20261102
      - release/socialmei-functional-integrations-20261026
      - feat/public-seo-discovery-consent-20261031
      - fix/functional-audit-20261031
      - fix/oci-release035-image-identity-20261101
      - feat/n8n-readonly-team-report-20261101
      - feat/instagram-direct-durable-recovery-20261101
    paths:
      - ".github/workflows/team-v33-candidate-images.yml"
      - "python-service/**"
      - "frontend/**"
      - "deploy/team/**"
      - "database/migrations/**"
      - "tools/team-v33-stage.py"
      - "tests/test_team_v33_stage.py"
      - "tools/team-v33-runtime-audit.py"
      - "tests/test_team_v33_runtime_audit.py"
      - "tools/team-whatsapp-private-mount.py"
      - "tests/test_team_whatsapp_private_mount.py"
      - "tools/team-v33-import-images.py"
      - "tools/team-oci-image-identity.py"
      - "tests/test_team_oci_image_identity.py"
      - "tests/test_team_v33_import_images.py"
      - "tools/team-release-profile.py"
      - "tests/test_team_release_profile.py"
      - "tools/release-migration-rehearsal.mjs"
      - "tools/release038-migration-rehearsal.mjs"
      - "tests/test_team_release038_profile.py"
      - "tests/release038-migration-rehearsal.test.cjs"
      - "tests/release-migration-rehearsal.test.cjs"

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact already-staged functional candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify pinned source, migrator and images
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -f python-service/Dockerfile
          test -f deploy/team/Dockerfile
          test -f frontend/socialmei-app.html
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("profile", "tools/team-release-profile.py")
          profile = importlib.util.module_from_spec(spec); spec.loader.exec_module(profile)
          folder = Path("database/migrations")
          names = sorted(p.name for p in folder.glob("*.sql"))
          verify = profile.verify038 if len(names) == 38 else profile.verify
          result = verify(names, lambda name: (folder / name).read_bytes())
          assert result["profile"] in ("035", "038")
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write("RELEASE_PROFILE=" + result["profile"] + "\n")
          PY
      - name: Set up Node for the isolated migration and restore rehearsal
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build API image outside production VPS
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --build-arg "SOCIALMEI_RELEASE_SHA=$CANDIDATE_SHA" \
            --label "org.opencontainers.image.revision=$CANDIDATE_SHA" \
            -t "socialmei-v33/team-api:$CANDIDATE_SHA" \
            -f python-service/Dockerfile python-service
      - name: Verify real PostgreSQL 16 upgrade and isolated backup restore
        shell: bash
        run: |
          set -euo pipefail
          api_image_id="$(docker image inspect --format '{{.Id}}' "socialmei-v33/team-api:$CANDIDATE_SHA")"
          rehearsal=tools/release-migration-rehearsal.mjs
          if [ "$RELEASE_PROFILE" = 038 ]; then rehearsal=tools/release038-migration-rehearsal.mjs; fi
          node "$rehearsal" --run \
            --source-sha "$CANDIDATE_SHA" \
            --api-image "$api_image_id" \
            --receipt migration-rehearsal.json
      - name: Build frontend/gateway image outside production VPS
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --label "org.opencontainers.image.revision=$CANDIDATE_SHA" \
            -t "socialmei-v33/team-gateway:$CANDIDATE_SHA" \
            -f deploy/team/Dockerfile .
      - name: Record image identity and create offline archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-images
          python3 - <<'PY'
          import json, os, subprocess
          import importlib.util
          sha = os.environ["CANDIDATE_SHA"]
          spec = importlib.util.spec_from_file_location("release_profile", "tools/team-release-profile.py")
          profile = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(profile)
          with open("migration-rehearsal.json") as f:
              verifier = profile.rehearsal038 if os.environ["RELEASE_PROFILE"] == "038" else profile.rehearsal
              proof = verifier(json.load(f), sha)
          result = {"source_sha": sha, "release_profile": os.environ["RELEASE_PROFILE"], "migration_sha256": proof["source_migrations"],
                    "migration_rehearsal": proof, "images": {}}
          for service in ("team-api", "team-gateway"):
              tag = f"socialmei-v33/{service}:{sha}"
              image = json.loads(subprocess.check_output(
                  ["docker", "image", "inspect", tag]))[0]
              assert image["Config"]["Labels"].get(
                  "org.opencontainers.image.revision") == sha
              result["images"][service] = {
                  "tag": tag, "image_id": image["Id"]
              }
          assert proof["api_image_id"] == result["images"]["team-api"]["image_id"]
          assert proof["api_image_revision"] == sha
          with open("candidate-images/image-receipt.json", "w") as f:
              json.dump(result, f, indent=2)
              f.write("\n")
          PY
          docker save \
            "socialmei-v33/team-api:$CANDIDATE_SHA" \
            "socialmei-v33/team-gateway:$CANDIDATE_SHA" \
            | gzip -1 > candidate-images/images.tar.gz
          test -s candidate-images/images.tar.gz
          cd candidate-images
          sha256sum images.tar.gz image-receipt.json > SHA256SUMS
      - name: Verify exact exported Docker/OCI image identity before upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, json, os
          from pathlib import Path
          importer_path = Path("tools/team-v33-import-images.py")
          spec = importlib.util.spec_from_file_location("team_image_import", importer_path)
          importer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(importer)
          receipt = json.loads(Path("candidate-images/image-receipt.json").read_text())
          assert receipt["source_sha"] == os.environ["CANDIDATE_SHA"]
          importer.verify_archive_config_digests(
              Path("candidate-images/images.tar.gz"),
              receipt["images"],
              receipt["source_sha"],
              "bundle",
          )
          print("Docker/OCI image identity verified for exact candidate SHA")
          PY
      - name: Upload image bundle without live credentials
        uses: actions/upload-artifact@v4
        with:
          name: SocialMEI-Team-${{ github.event.pull_request.head.sha }}
          path: candidate-images/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
