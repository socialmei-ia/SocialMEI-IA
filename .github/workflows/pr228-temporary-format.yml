name: Temporary PR228 formatting

on:
  push:
    branches: [feat/booking-recovery-finish-20261112]

permissions:
  contents: write

concurrency:
  group: pr228-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format only PR228 touched sources
        run: |
          npx prettier --write \
            frontend/scripts/v22-appointments.js \
            frontend/scripts/v22-inbox-customer.js \
            tests/appointments-browser.cjs \
            tests/inbox-customer-browser.cjs \
            compose.team-instagram-auto.yaml \
            compose.team-recovery.yaml
          git config user.name "SocialMEI CI formatter"
          git config user.email "ci-formatter@users.noreply.github.com"
          git add \
            frontend/scripts/v22-appointments.js \
            frontend/scripts/v22-inbox-customer.js \
            tests/appointments-browser.cjs \
            tests/inbox-customer-browser.cjs \
            compose.team-instagram-auto.yaml \
            compose.team-recovery.yaml
          if ! git diff --cached --quiet; then
            git commit -m "style(pr228): apply pinned Prettier to updated files"
            git push origin HEAD:feat/booking-recovery-finish-20261112
          fi
