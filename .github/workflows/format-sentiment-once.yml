name: One-time format existing sentiment worker
on:
  push:
    branches:
      - feat/n8n-provider-sentiment-20261030
permissions:
  contents: write
jobs:
  format-candidate:
    if: github.repository == 'socialmei-ia/SocialMEI-IA' && github.actor == 'socialmei-ia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format only modified source and docs
        run: |
          npx prettier --write \
            n8n-workflows/experimental/provider-sentiment-worker.json \
            n8n-workflows/README.md \
            tests/provider-sentiment-n8n.test.cjs \
            tests/provider-sentiment-workflow.test.cjs \
            docs/N8N-PROVIDER-SENTIMENT.md \
            docs/CONTINUIDADE-FUNCIONAL-20261030.md
          git diff --check
      - name: Commit formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            n8n-workflows/experimental/provider-sentiment-worker.json \
            n8n-workflows/README.md \
            tests/provider-sentiment-n8n.test.cjs \
            tests/provider-sentiment-workflow.test.cjs \
            docs/N8N-PROVIDER-SENTIMENT.md \
            docs/CONTINUIDADE-FUNCIONAL-20261030.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format existing sentiment worker validation'
          git push origin HEAD:refs/heads/feat/n8n-provider-sentiment-20261030
