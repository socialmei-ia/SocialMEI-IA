name: Package public demonstration (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node --test tests/public-demo-entry.test.cjs tests/prototype-reference-fidelity.test.cjs
      - run: |
          node tools/package-public-demo.mjs
          node tools/verify-public-demo.mjs test-results/public-demo "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: SocialMEI-public-demo-${{ github.sha }}
          path: test-results/public-demo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
