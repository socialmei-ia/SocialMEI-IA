name: Format public SEO files once
on:
  push:
    branches:
      - feat/public-seo-discovery-consent-20261031
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'socialmei-ia/SocialMEI-IA' && github.actor == 'socialmei-ia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write frontend/sobre.html frontend/scripts/site-metrics.js tests/public-site-seo.test.cjs docs/SOCIALMEI-PUBLIC-SEO-ANALYTICS.md
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/sobre.html frontend/scripts/site-metrics.js tests/public-site-seo.test.cjs docs/SOCIALMEI-PUBLIC-SEO-ANALYTICS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format public SEO and consent documentation'
          git push origin HEAD:refs/heads/feat/public-seo-discovery-consent-20261031
