name: Format WhatsApp preview once
on:
  push:
    branches:
      - feat/whatsapp-bot-readonly-preview-20261030
permissions:
  contents: write
jobs:
  format-two-files:
    if: github.repository == 'socialmei-ia/SocialMEI-IA' && github.actor == 'socialmei-ia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write frontend/scripts/v22-whatsapp-catalog.js tests/v22-whatsapp-catalog-browser.cjs
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/scripts/v22-whatsapp-catalog.js tests/v22-whatsapp-catalog-browser.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format WhatsApp bot preview UI and browser coverage'
          git push origin HEAD:refs/heads/feat/whatsapp-bot-readonly-preview-20261030
