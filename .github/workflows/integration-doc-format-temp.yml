name: Temporary document formatting inspection
on:
  push:
    branches:
      - release/socialmei-functional-integrations-20261026
permissions:
  contents: read
jobs:
  format-doc-inspection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Print exact Prettier document output (public documentation only)
        run: |
          npx prettier --write docs/SOCIALMEI-FASES-INTEGRACAO-REAL.md
          python - <<'PY'
          from pathlib import Path
          import base64
          print("DOCUMENT_BASE64 " + base64.b64encode(Path("docs/SOCIALMEI-FASES-INTEGRACAO-REAL.md").read_bytes()).decode())
          PY
