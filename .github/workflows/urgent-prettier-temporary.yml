name: Temporary urgent PR formatting
on:
  push:
    branches:
      - feat/urgent-feedback-n8n-20261021
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'socialmei-ia/SocialMEI-IA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/urgent-feedback-n8n-20261021
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install formatter
        run: npm ci --ignore-scripts
      - name: Format only reported files
        run: |
          npx prettier --write \
            frontend/scripts/content-studio.js \
            frontend/scripts/opportunities.js \
            frontend/socialmei-app.html \
            tests/native-opportunities-browser.cjs
      - name: Commit formatting in this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/scripts/content-studio.js frontend/scripts/opportunities.js frontend/socialmei-app.html tests/native-opportunities-browser.cjs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to urgent UI changes"
            git push origin HEAD:feat/urgent-feedback-n8n-20261021
          fi
