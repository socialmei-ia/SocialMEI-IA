name: Instagram direct alias PR 220 isolated verification

on:
  push:
    branches:
      - ci/instagram-alias-220-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialmei_test
          POSTGRES_PASSWORD: socialmei_test
          POSTGRES_DB: socialmei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialmei_test -d socialmei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://socialmei_test:socialmei_test@127.0.0.1:5432/socialmei_test
      DATABASE_URL: postgresql://socialmei_test:socialmei_test@127.0.0.1:5432/socialmei_test
      SOCIALMEI_SHARED_DATA_ENABLED: "true"
      SOCIALMEI_WORKSPACE_SLUG: ci-shared-data
      SOCIALMEI_WORKSPACE_NAME: CI Shared Data
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API runtime and isolated test dependencies
        run: python -m pip install -r python-service/requirements.txt
      - name: Pilot guard tests
        run: python -m unittest discover -s tests -p 'test_whatsapp_pilot_guard.py' -v
      - name: Menu worker tests
        run: python -m unittest discover -s tests -p 'test_whatsapp_menu_worker.py' -v
      - name: Complete mocked dispatch tests
        run: python -m unittest discover -s tests -p 'test_whatsapp_flow_mock.py' -v
      - name: WhatsApp workspace planning contracts
        run: python -m unittest discover -s tests -p 'test_whatsapp_workspace_plan.py' -v
      - name: Broader WhatsApp API contracts (disposable PostgreSQL)
        env:
          PYTHONPATH: python-service
        run: python -m unittest discover -s python-service -p 'test_whatsapp*.py' -v
      - name: Instagram signed ingress and OAuth alias on disposable PostgreSQL
        env:
          PYTHONPATH: python-service
        run: |
          python -m unittest discover -s python-service -p 'test_instagram_n8n_ingress.py' -v
          python -m unittest discover -s python-service -p 'test_instagram_meta_ingress.py' -v
      - name: Instagram runtime contracts (disposable PostgreSQL)
        env:
          PYTHONPATH: python-service
        run: python -m unittest discover -s python-service -p 'test_instagram_runtime.py' -v
      - name: Instagram OAuth regression on its own disposable database
        env:
          PYTHONPATH: python-service
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["TEST_DATABASE_URL"], autocommit=True) as conn:
              conn.execute("CREATE DATABASE socialmei_oauth_ci")
          PY
          export TEST_DATABASE_URL=postgresql://socialmei_test:socialmei_test@127.0.0.1:5432/socialmei_oauth_ci
          export DATABASE_URL="$TEST_DATABASE_URL"
          python -m unittest discover -s python-service -p 'test_instagram_persistent_oauth.py' -v
