name: WhatsApp pilot PR 219 isolated verification

on:
  push:
    branches:
      - ci/whatsapp-pilot-219-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        run: python -m pip install 'httpx==0.28.1'
      - name: Pilot guard tests
        run: python -m unittest discover -s tests -p 'test_whatsapp_pilot_guard.py' -v
      - name: Menu worker tests
        run: python -m unittest discover -s tests -p 'test_whatsapp_menu_worker.py' -v
      - name: Complete mocked dispatch tests
        run: python -m unittest discover -s tests -p 'test_whatsapp_flow_mock.py' -v
