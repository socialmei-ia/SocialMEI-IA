name: Format candidate handoff doc once
on:
  push:
    branches:
      - feat/team-release-candidate-stage-20261030
permissions:
  contents: write
jobs:
  format-handoff:
    if: github.repository == 'socialmei-ia/SocialMEI-IA' && github.actor == 'socialmei-ia'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write docs/TEAM-CANDIDATE-SAFE-HANDOFF.md
          git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/TEAM-CANDIDATE-SAFE-HANDOFF.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format candidate staging handoff guide'
          git push origin HEAD:refs/heads/feat/team-release-candidate-stage-20261030
