name: One-time format functional candidate
on:
  push:
    branches:
      - feat/instagram-owner-token-renewal-20261030
permissions:
  contents: write
jobs:
  format-candidate:
    if: github.repository == 'socialmei-ia/SocialMEI-IA' && github.actor == 'socialmei-ia'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current head
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install formatter from lockfile
        run: npm ci
      - name: Format only changed files
        run: |
          npx prettier --write \
            frontend/scripts/v22-instagram.js \
            frontend/scripts/v22-whatsapp-readiness.js \
            tests/instagram-token-renewal.test.cjs \
            tests/recovery-link.test.cjs \
            tests/v22-whatsapp-readiness.test.cjs \
            docs/CONTINUIDADE-FUNCIONAL-20261030.md
          git diff --check
      - name: Commit formatting only to candidate head
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            frontend/scripts/v22-instagram.js \
            frontend/scripts/v22-whatsapp-readiness.js \
            tests/instagram-token-renewal.test.cjs \
            tests/recovery-link.test.cjs \
            tests/v22-whatsapp-readiness.test.cjs \
            docs/CONTINUIDADE-FUNCIONAL-20261030.md
          if git diff --cached --quiet; then
            echo 'Formatting already clean.'
            exit 0
          fi
          git commit -m 'style: format verified functional candidate files'
          git push origin HEAD:refs/heads/feat/instagram-owner-token-renewal-20261030
