name: Format V22 report integration browser test
on:
  push:
    branches:
      - feat/v22-knowledge-reporting-ui-20261026
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v22-knowledge-reporting-ui-20261026
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write tests/v22-knowledge-reporting-browser.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v22-knowledge-reporting-browser.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Format V22 knowledge browser coverage"
            git push origin HEAD:feat/v22-knowledge-reporting-ui-20261026
          fi
