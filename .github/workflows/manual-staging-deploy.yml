name: Manual staging deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite STAGING para confirmar a atualização do ambiente de teste"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGING'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update staging host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"

          printf -v deploy_path_q '%q' "$DEPLOY_PATH"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             cd $deploy_path_q
             if [ -n \"\$(git status --porcelain)\" ]; then
               echo 'Deploy bloqueado: existem mudanças locais não commitadas no staging.'
               exit 1
             fi
             git fetch origin main
             git switch main
             git pull --ff-only origin main
             docker compose config --quiet
             docker compose up -d --build
             docker compose ps"

      - name: Deployment summary
        run: |
          {
            echo "## Staging atualizado"
            echo ""
            echo '- Branch: `main`'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            echo '- Ambiente: `staging`'
            echo "- Atualização executada via GitHub Actions."
          } >> "$GITHUB_STEP_SUMMARY"
