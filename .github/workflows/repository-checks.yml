name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialmei_test
          POSTGRES_PASSWORD: socialmei_test
          POSTGRES_DB: socialmei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialmei_test -d socialmei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://socialmei_test:socialmei_test@127.0.0.1:5432/socialmei_test
      DATABASE_URL: postgresql://socialmei_test:socialmei_test@127.0.0.1:5432/socialmei_test
      SOCIALMEI_SHARED_DATA_ENABLED: "true"
      SOCIALMEI_WORKSPACE_SLUG: ci-shared-data
      SOCIALMEI_WORKSPACE_NAME: CI Shared Data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maintenance tools
        run: npm ci
      - name: Contracts and repository structure
        run: npm test
      - name: Formatting
        run: npm run format:check
      - name: Python contracts
        run: |
          python -m pip install -r python-service/requirements.txt
          python -m unittest discover -s python-service -p 'test_*.py'
      - name: Backup failure and recovery scenarios
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Shell syntax
        run: bash -n backup.sh
      - name: Compose configuration without starting services
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.development.example -f compose.dev.yaml config --quiet
      - name: README assets and stale repository URLs
        run: |
          test -f docs/assets/socialmei-banner.png
          test -f docs/assets/socialmei-banner.svg
          test -f docs/assets/socialmei-logo.png
          if rg -n 'socialmei-ia\.github\.io/socialmei/|github\.com/socialmei-ia/socialmei([/#.]|$)' \
            --glob '*.md' --glob '*.yml' --glob '*.yaml' \
            --glob '!repository-checks.yml' --glob '!node_modules/**' .; then
            echo 'Foram encontradas URLs antigas do repositório.'
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install tools and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Offline application regression
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-regression
          path: test-results/
          if-no-files-found: ignore
