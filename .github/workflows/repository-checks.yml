name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches:
      [
        main,
        feat/backend-provider-readiness,
        feat/ux-interaction-refinement,
        release/integration-candidate-80,
        release/integration-candidate-94-review,
        feat/priority-integrations,
        feat/isolated-preview,
        feat/dashboard-functional-readiness,
        feat/visual-opportunities-content-91,
        feat/native-opportunities-v8-content-v4,
        feat/instagram-provider-lab,
        feat/instagram-meta-contract-gates,
        feat/instagram-meta-http-adapter,
        feat/instagram-token-vault,
        feat/instagram-persistent-oauth,
        feat/instagram-durable-webhook,
        feat/instagram-direct-outbox,
        feat/instagram-posts-inbox-real,
        release/socialmei-functional-integrations-20261026,
        feat/opportunity-planning-persistence,
        feat/waha-durable-ingress,
        feat/frontend-v25-integration,
        feat/whatsapp-interactive-bot,
        feat/instagram-token-maintenance,
        feat/n8n-live-inventory-20261028,
        feat/provider-sentiment-inbox-20261029,
      ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialmei_test
          POSTGRES_PASSWORD: socialmei_test
          POSTGRES_DB: socialmei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialmei_test -d socialmei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://socialmei_test:socialmei_test@127.0.0.1:5432/socialmei_test
      DATABASE_URL: postgresql://socialmei_test:socialmei_test@127.0.0.1:5432/socialmei_test
      SOCIALMEI_SHARED_DATA_ENABLED: "true"
      SOCIALMEI_WORKSPACE_SLUG: ci-shared-data
      SOCIALMEI_WORKSPACE_NAME: CI Shared Data
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maintenance tools
        run: npm ci
      - name: Contracts and repository structure
        run: npm test
      - name: Package isolated public candidate (no publication)
        run: |
          node tools/package-public-demo.mjs
          node tools/verify-public-demo.mjs test-results/public-demo "$(git rev-parse HEAD)"
      - name: Save static candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialMEI-public-demo-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/public-demo/
          if-no-files-found: error
          retention-days: 14
      - name: Formatting
        run: npm run format:check
      - name: Python contracts
        run: |
          python -m pip install -r python-service/requirements.txt
          python -m unittest discover -s python-service -p 'test_*.py'
      - name: Release candidate migrations and recovery (disposable PostgreSQL)
        run: python tests/release-candidate-db.py --run --output test-results/release-candidate
      - name: Save sanitized release candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-readiness
          path: test-results/release-candidate/*.json
          if-no-files-found: ignore
      - name: Backup failure and recovery scenarios
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Caddy OAuth privacy canary (disposable container only)
        env:
          SOCIALMEI_INSTAGRAM_PROXY_TEST: "true"
        run: python -m unittest discover -s tests -p 'test_instagram_proxy_privacy.py'
      - name: Prepare Instagram gateway release without changing the installed fixture
        env:
          SOCIALMEI_INSTAGRAM_RELEASE_TEST: "true"
        run: python -m unittest discover -s tests -p 'test_instagram_release_prepare.py'
      - name: Protected team gateway
        env:
          SOCIALMEI_TEAM_GATEWAY_TEST: "true"
        run: python -m unittest discover -s tests -p 'test_team_gateway.py'
      - name: Isolated team stack startup
        run: |
          python - <<'PYTHON'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("admin", "tools/team-admin.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.ask_user = lambda: ("ci", module.hash_password("individual-ci-test-password"))
          module.init("app.example.com")
          PYTHON
          docker compose --env-file .env.team -f compose.team.yaml up -d --build --wait --wait-timeout 120
          docker compose --env-file .env.team -f compose.team.yaml exec -T team-api python -c "from database import check_database; check_database()"
          docker compose --env-file .env.team -f compose.team.yaml run --rm team-migrate
          docker compose --env-file .env.team -f compose.team.yaml exec -T team-gateway caddy validate --config /etc/caddy/Caddyfile
          python tools/team-maintenance.py doctor
          python - <<'PYTHON'
          import importlib.util
          from pathlib import Path
          import subprocess
          spec = importlib.util.spec_from_file_location("maintenance", "tools/team-maintenance.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          seed = "import json, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/clientes', data=json.dumps({'nome':'CI backup restore'}).encode(), headers={'Content-Type':'application/json'}))"
          subprocess.run(module.compose("exec", "-T", "team-api", "python", "-c", seed), check=True)
          attendance = """
          WITH canal AS (
            INSERT INTO socialmei.crm_canais (workspace_id, instancia, sessao)
            SELECT id, 'ci-backup', 'default' FROM socialmei.workspaces WHERE slug = 'team'
            RETURNING workspace_id, id
          ), conversa AS (
            INSERT INTO socialmei.crm_conversas_canal (workspace_id, canal_id, identificador_externo)
            SELECT workspace_id, id, 'ci-chat@c.us' FROM canal
            RETURNING workspace_id, canal_id, id
          )
          INSERT INTO socialmei.crm_mensagens_canal
            (workspace_id, canal_id, conversa_id, identificador_externo, direcao, conteudo, status)
          SELECT workspace_id, canal_id, id, 'ci-backup-message', 'entrada', 'CI attendance restore', 'recebida'
          FROM conversa;
          """
          subprocess.run(module.compose("exec", "-T", "team-postgres", "psql", "-U", "socialmei_team", "-d", "socialmei_team", "-v", "ON_ERROR_STOP=1"), input=attendance, text=True, check=True)
          account_seed = "from account_admin import create_admin; from account_auth import hash_password, issue_session; from database import connect; from fastapi import Response; uid=create_admin('ci-owner@example.com','CI Owner',hash_password('CI-test-only-password-123!')); conn=connect(); wid=conn.execute(\"SELECT id FROM socialmei.workspaces WHERE slug='team'\").fetchone()[0]; issue_session(conn,uid,wid,Response(),False); conn.commit(); conn.close()"
          subprocess.run(module.compose("exec", "-T", "team-api", "python", "-c", account_seed), check=True)
          folder = module.backup()
          subprocess.run(module.compose("exec", "-T", "team-postgres", "createdb", "-U", "socialmei_team", "socialmei_backup_check"), check=True)
          try:
              with (folder / "equipe.dump").open("rb") as source:
                  subprocess.run(module.compose("exec", "-T", "team-postgres", "pg_restore", "-U", "socialmei_team", "-d", "socialmei_backup_check", "--exit-on-error"), stdin=source, check=True)
              query = "SELECT COUNT(*) FROM socialmei.crm_clientes WHERE nome = 'CI backup restore'; SELECT COUNT(*) FROM socialmei.crm_mensagens_canal WHERE identificador_externo = 'ci-backup-message' AND conteudo = 'CI attendance restore'; SELECT COUNT(*) FROM socialmei.auth_credenciais c JOIN socialmei.users u ON u.id=c.user_id WHERE u.email='ci-owner@example.com' AND c.administrador_plataforma AND c.senha_hash LIKE '$argon2id$%'; SELECT COUNT(*) FROM socialmei.auth_sessoes s JOIN socialmei.users u ON u.id=s.user_id WHERE u.email='ci-owner@example.com' AND s.revogada_em IS NULL"
              result = subprocess.check_output(module.compose("exec", "-T", "team-postgres", "psql", "-U", "socialmei_team", "-d", "socialmei_backup_check", "-Atc", query), text=True)
              assert result.strip().splitlines() == ["1", "1", "1", "1"], result
              print("Backup restaurado: cliente, atendimento, administrador e sessão conferidos no banco isolado de CI.")
          finally:
              subprocess.run(module.compose("exec", "-T", "team-postgres", "dropdb", "-U", "socialmei_team", "socialmei_backup_check"), check=True)
          PYTHON
      - name: Stop isolated team CI stack
        if: always()
        run: |
          if test -f .env.team; then
            docker compose --env-file .env.team -f compose.team.yaml down --volumes
          fi
      - name: Shell syntax
        run: bash -n backup.sh
      - name: Compose configuration without starting services
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.development.example -f compose.dev.yaml config --quiet
          TEAM_POSTGRES_PASSWORD=ci-team-only SOCIALMEI_TEAM_HOST=app.example.com docker compose -f compose.team.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.team-proxy.yaml config --quiet
      - name: README assets and stale repository URLs
        run: |
          test -f docs/assets/socialmei-banner.png
          test -f docs/assets/socialmei-banner.svg
          test -f docs/assets/socialmei-logo.png
          if rg -n 'socialmei-ia\.github\.io/socialmei/|github\.com/socialmei-ia/socialmei([/#.]|$)' \
            --glob '*.md' --glob '*.yml' --glob '*.yaml' \
            --glob '!repository-checks.yml' --glob '!node_modules/**' .; then
            echo 'Foram encontradas URLs antigas do repositório.'
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install tools and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install PDF text extraction for Reports V2 tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
      - name: V22 native navigation, eleven resolutions, themes, keyboard and motion
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-regression
          path: test-results/
          if-no-files-found: ignore

  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install tools and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real isolated preview API and browser
        run: |
          npm run preview -- up
          npm run test:preview
      - name: Fake Instagram provider in disposable preview only
        run: |
          docker compose --project-name socialmei-preview --env-file .preview/.env -f compose.preview.yaml -f compose.preview.instagram-lab.yaml up -d --no-build --wait --wait-timeout 180 api
          node tests/instagram-provider-lab-preview.cjs
      - name: Preview startup diagnostics
        if: failure()
        run: |
          if test -f .preview/.env; then
            docker compose --project-name socialmei-preview --env-file .preview/.env -f compose.preview.yaml ps
            docker compose --project-name socialmei-preview --env-file .preview/.env -f compose.preview.yaml logs --tail 80 web
          fi
      - name: Stop local preview
        if: always()
        run: |
          if test -f .preview/.env; then npm run preview -- down; fi
      - name: Save real preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-preview
          path: |
            test-results/preview/
            test-results/instagram-provider-lab/
          if-no-files-found: ignore
