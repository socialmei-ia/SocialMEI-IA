name: Format Instagram pilot frontend
on:
  push:
    branches:
      - feat/instagram-posts-inbox-real
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/instagram-posts-inbox-real
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format affected JavaScript with repository Prettier
        run: |
          npx prettier --write frontend/scripts/v22-backend.js frontend/scripts/v22-instagram-publisher.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/scripts/v22-backend.js frontend/scripts/v22-instagram-publisher.js
          if ! git diff --cached --quiet; then
            git commit -m "Format Instagram pilot V22 scripts"
            git push origin HEAD:feat/instagram-posts-inbox-real
          fi
