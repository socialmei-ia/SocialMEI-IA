name: WhatsApp regression (isolated)
on:
  push:
    branches:
      - feat/whatsapp-gows-listas-optin-20261109

permissions:
  contents: read

concurrency:
  group: whatsapp-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  menu-catalog-dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: socialmei_test
          POSTGRES_PASSWORD: socialmei_test
          POSTGRES_DB: socialmei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U socialmei_test -d socialmei_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: python-service
      TEST_DATABASE_URL: postgresql://socialmei_test:socialmei_test@127.0.0.1:5432/socialmei_test
      DATABASE_URL: postgresql://socialmei_test:socialmei_test@127.0.0.1:5432/socialmei_test
      SOCIALMEI_SHARED_DATA_ENABLED: "true"
      SOCIALMEI_WORKSPACE_SLUG: ci-shared-data
      SOCIALMEI_WORKSPACE_NAME: CI Shared Data
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared Python dependencies
        run: python -m pip install -r python-service/requirements.txt
      - name: Menu, catalog, ingress and dedup on disposable PostgreSQL
        run: >-
          python -m unittest -v
          test_whatsapp_empty_catalog
          test_whatsapp_bot
          test_whatsapp_bot_preview
          test_whatsapp_catalog
          test_waha_ingress
      - name: Read-only pairing diagnostic offline tests
        run: python -m unittest discover -s tests -p 'test_gows_pairing_diagnostic.py' -v
