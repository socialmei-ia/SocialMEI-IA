name: Format public beta landing once
on:
  push:
    branches: [feat/native-opportunities-v8-content-v4]
    paths:
      - .github/workflows/temp-format-public-beta.yml
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: |
          npx prettier --write frontend/testes-publicos.html
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/testes-publicos.html
            git commit -m "style(demo): format public test landing"
            git push origin HEAD:refs/heads/feat/native-opportunities-v8-content-v4
          fi
