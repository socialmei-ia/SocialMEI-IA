name: Temporary team formatter

on:
  push:
    branches:
      - docs/team-access-docker

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/team-access-docker
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write tools/team-doctor.mjs docs/ONBOARDING.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/team-doctor.mjs docs/ONBOARDING.md
          git commit -m "Format team onboarding"
          git push origin HEAD:docs/team-access-docker
