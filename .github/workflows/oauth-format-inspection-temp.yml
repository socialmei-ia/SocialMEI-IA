name: Temporary OAuth formatting inspection

on:
  push:
    branches:
      - fix/instagram-oauth-callback-404

permissions:
  contents: read

jobs:
  print-formatted-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format for inspection without committing
        run: |
          npx prettier --write frontend/scripts/v22-instagram.js tests/v22-instagram-browser.cjs
          python - <<'PY'
          import base64
          from pathlib import Path
          for path in (
              "frontend/scripts/v22-instagram.js",
              "tests/v22-instagram-browser.cjs",
          ):
              print("FORMAT_BEGIN " + path)
              print("FORMAT_BASE64 " + base64.b64encode(Path(path).read_bytes()).decode("ascii"))
              print("FORMAT_END " + path)
          PY
