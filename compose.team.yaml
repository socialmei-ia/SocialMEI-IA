# Separate project/volumes: never combine with compose.yaml or compose.dev.yaml.
name: socialmei-team
services:
  team-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialmei_team
      POSTGRES_PASSWORD: ${TEAM_POSTGRES_PASSWORD:?Use tools/team-admin.py init}
      POSTGRES_DB: socialmei_team
    volumes:
      - team_postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialmei_team -d socialmei_team"]
      interval: 5s
      timeout: 5s
      retries: 10

  team-migrate:
    build: ./python-service
    command: python /maintenance/team_migrate.py
    environment: &database_environment
      PYTHONPATH: /app
      POSTGRES_HOST: team-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: socialmei_team
      POSTGRES_PASSWORD: ${TEAM_POSTGRES_PASSWORD:?Use tools/team-admin.py init}
      POSTGRES_DB: socialmei_team
    volumes:
      - ./tools/team_migrate.py:/maintenance/team_migrate.py:ro
      - ./database/migrations:/migrations:ro
    networks: [database]
    depends_on:
      team-postgres:
        condition: service_healthy

  team-api:
    build:
      context: ./python-service
      args:
        SOCIALMEI_RELEASE_SHA: ${SOCIALMEI_RELEASE_SHA:-unknown}
    restart: unless-stopped
    environment:
      <<: *database_environment
      SOCIALMEI_SHARED_DATA_ENABLED: "true"
      SOCIALMEI_WORKSPACE_SLUG: team
      SOCIALMEI_WORKSPACE_NAME: SocialMEI Equipe
      SOCIALMEI_N8N_READ_TOKEN: ${TEAM_N8N_READ_TOKEN:-}
      SOCIALMEI_AUTH_ENABLED: ${TEAM_AUTH_ENABLED:-false}
      # Explicit Instagram Login wiring. Defaults remain fail-closed.
      # Secrets are supplied only through the server-private .env.team.
      SOCIALMEI_INSTAGRAM_RUNTIME_MODE: ${SOCIALMEI_INSTAGRAM_RUNTIME_MODE:-disabled}
      SOCIALMEI_INSTAGRAM_CLIENT_ID: ${SOCIALMEI_INSTAGRAM_CLIENT_ID:-}
      SOCIALMEI_INSTAGRAM_CLIENT_SECRET: ${SOCIALMEI_INSTAGRAM_CLIENT_SECRET:-}
      SOCIALMEI_INSTAGRAM_GRAPH_VERSION: ${SOCIALMEI_INSTAGRAM_GRAPH_VERSION:-}
      SOCIALMEI_INSTAGRAM_SCOPES: ${SOCIALMEI_INSTAGRAM_SCOPES:-}
      SOCIALMEI_INSTAGRAM_AUTHORIZATION_EMBED: ${SOCIALMEI_INSTAGRAM_AUTHORIZATION_EMBED:-}
      SOCIALMEI_INSTAGRAM_TOKEN_KEYRING: ${SOCIALMEI_INSTAGRAM_TOKEN_KEYRING:-}
      SOCIALMEI_INSTAGRAM_TOKEN_ACTIVE_KEY_ID: ${SOCIALMEI_INSTAGRAM_TOKEN_ACTIVE_KEY_ID:-}
      SOCIALMEI_INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${SOCIALMEI_INSTAGRAM_WEBHOOK_VERIFY_TOKEN:-}
      SOCIALMEI_INSTAGRAM_RUNTIME_INGRESS_ENABLED: ${SOCIALMEI_INSTAGRAM_RUNTIME_INGRESS_ENABLED:-false}
      SOCIALMEI_INSTAGRAM_RUNTIME_SEND_ENABLED: ${SOCIALMEI_INSTAGRAM_RUNTIME_SEND_ENABLED:-false}
      SOCIALMEI_INSTAGRAM_DIRECT_OWNER: ${SOCIALMEI_INSTAGRAM_DIRECT_OWNER:-unassigned}
      SOCIALMEI_INSTAGRAM_PROXY_PRIVACY_REVIEWED: ${SOCIALMEI_INSTAGRAM_PROXY_PRIVACY_REVIEWED:-false}
      SOCIALMEI_INSTAGRAM_PUBLISH_ENABLED: ${SOCIALMEI_INSTAGRAM_PUBLISH_ENABLED:-false}
      # Optional recovery; credentials stay in private server environment.
      SOCIALMEI_RECOVERY_MODE: ${SOCIALMEI_RECOVERY_MODE:-disabled}
      SOCIALMEI_KNOWLEDGE_PDF_ENABLED: ${SOCIALMEI_KNOWLEDGE_PDF_ENABLED:-false}
      SOCIALMEI_WA_CATALOG_ENABLED: ${SOCIALMEI_WA_CATALOG_ENABLED:-false}
      SOCIALMEI_SMTP_HOST: ${SOCIALMEI_SMTP_HOST:-}
      SOCIALMEI_SMTP_PORT: ${SOCIALMEI_SMTP_PORT:-465}
      SOCIALMEI_SMTP_USER: ${SOCIALMEI_SMTP_USER:-}
      SOCIALMEI_SMTP_PASSWORD: ${SOCIALMEI_SMTP_PASSWORD:-}
      SOCIALMEI_SMTP_FROM: ${SOCIALMEI_SMTP_FROM:-}
      # Cadastro temporariamente aberto no piloto da equipe; use invite para restringir.
      SOCIALMEI_REGISTRATION_MODE: ${TEAM_REGISTRATION_MODE:-open}
      SOCIALMEI_AUTH_ORIGIN: https://${SOCIALMEI_TEAM_HOST:?Use tools/team-admin.py init}
      # Same origin via gateway; no cross-origin browser access.
      SOCIALMEI_CORS_ORIGINS: ""
      TZ: America/Recife
    networks: [database, api]
    depends_on:
      team-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  team-gateway:
    build:
      context: .
      dockerfile: deploy/team/Dockerfile
    restart: unless-stopped
    environment:
      SOCIALMEI_TEAM_HOST: ${SOCIALMEI_TEAM_HOST:?Use tools/team-admin.py init}
    volumes:
      - ./deploy/team/private:/etc/caddy/private:ro
      - ./deploy/team/private/config.js:/srv/frontend/config.js:ro
    networks:
      api:
      web:
        aliases: [socialmei-team-gateway]
    depends_on:
      team-api:
        condition: service_healthy

networks:
  database:
    internal: true
  api:
    internal: true
  web:
    name: socialmei_team_web
volumes:
  team_postgres_data:
