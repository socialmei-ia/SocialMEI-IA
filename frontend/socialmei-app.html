:root{--w:#fff;--h1:#f7faff;--h2:#e6edf8;--hov:#f1f6ff;--bg2:#f8fafd;--o:#dbe8ff;--bl:#b9cdf5;--av:#dfe9fb;--pb:#0a5cf5;color-scheme:light}

@media (prefers-reduced-motion:reduce){#v>.hero,#v>.hero *,#v>.hero *::before,#v>.hero *::after{animation:none!important;transition:none!important}}
/* fim do hero do Início v20 */
/* Início no celular v21 (bloco reversível: apague daqui até "fim do Início no celular v21")
   A ação principal sobe para antes de "Para hoje": no celular a ordem passa a ser
   saudação, busca, cartões de ação, lista. A coluna da esquerda vira "transparente" (display:contents)
   só para a ordem poder ser trocada sem mexer no HTML; no computador nada muda. */
@media(max-width:900px){
 #v>.hero{gap:0;padding:20px 16px 28px!important}
 #v>.hero>.hl{display:contents}
 #v>.hero .bar{margin-bottom:14px}
 #v>.hero p.m:not(.hq){font-size:18px!important}
 #v>.hero h1{font-size:clamp(30px,9.4vw,38px)!important}
 #v>.hero .hq{font-size:15.5px!important;margin-top:8px!important}
 #v>.hero .cmd{margin-top:16px}
 #v>.hero .cs{order:2;flex:none;margin-top:18px;gap:10px}  /* flex:none: o 460px da regra de computador virava altura em coluna */
 #v>.hero .phj{order:3;max-width:none;margin-top:22px}
 #v>.hero .cs>.hc:nth-child(n){min-height:0;border-left-width:8px;border-radius:16px}
 #v>.hero .cs>.hc:nth-child(1){padding:14px 16px;gap:14px;font-size:18px}
 #v>.hero .cs>.hc:nth-child(1) .ic{width:52px;height:52px}
 #v>.hero .cs>.hc:nth-child(1) .ic svg{width:30px;height:30px}
 #v>.hero .cs>.hc:nth-child(n+2){padding:10px 14px;gap:12px;font-size:16px}
 #v>.hero .cs>.hc:nth-child(n+2) .ic{width:40px;height:40px;border-radius:12px}
 #v>.hero .cs>.hc:nth-child(n+2) .ic svg{width:24px;height:24px}
 #v>.hero .cs>.hc:nth-child(n+2) .hs{font-size:13px;margin-top:1px}
 #v>.hero .cs>.hc .hc>.i:last-child,#v>.hero .cs>.hc>.i:last-child{width:20px;height:20px}
 #v>.hero .cs::before{inset:-20px -10px}
}
